[package]
name = "mirai-client"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
mirai-core.workspace = true
# Remote analysis only: a client never spawns KataGo.
mirai-engine = { workspace = true, default-features = false, features = ["remote"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
anyhow.workspace = true
clap.workspace = true
# `examples/selfplay.rs` regenerates the SGF fixture, so it needs a real KataGo. The
# library above still builds none of that machinery: `local` is enabled for test and
# example targets only, which is why it is here and not in `[dependencies]`.
mirai-engine = { workspace = true, features = ["local"] }
