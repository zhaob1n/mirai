[package]
name = "mirai-server"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Headless host sharing KataGo with mirai clients over QUIC"
repository.workspace = true
readme.workspace = true
keywords = ["go", "baduk", "katago", "quic"]
categories = ["games", "network-programming", "command-line-utilities"]

[[bin]]
name = "mirai-server"
path = "src/main.rs"

[dependencies]
mirai-core.workspace = true
mirai-engine = { workspace = true, features = ["local"] }
mirai-proto = { workspace = true, features = ["quinn-transport"] }
clap.workspace = true
toml.workspace = true
serde.workspace = true
subtle.workspace = true
quinn.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["io-util", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
directories.workspace = true
