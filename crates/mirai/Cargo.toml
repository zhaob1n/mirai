[package]
name = "mirai"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "GTK4/libadwaita Go board for analysis, review and play with KataGo"
repository.workspace = true
readme.workspace = true
keywords = ["go", "baduk", "weiqi", "katago", "gtk"]
categories = ["games", "gui"]

[[bin]]
name = "mirai"
path = "src/main.rs"

[dependencies]
mirai-core.workspace = true
mirai-client.workspace = true
mirai-engine = { workspace = true, features = ["local", "remote"] }
mirai-proto.workspace = true
gtk.workspace = true
adw.workspace = true
glib.workspace = true
# `signal` for the termination watcher in `application_shell.rs`: SIGINT/SIGTERM/SIGHUP,
# or Windows console control events.
tokio = { workspace = true, features = ["signal"] }
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true

[build-dependencies]
glib-build-tools.workspace = true
