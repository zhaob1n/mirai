[workspace]
resolver = "3"
members = [
    "crates/mirai-core",
    "crates/mirai-proto",
    "crates/mirai-engine",
    "crates/mirai-client",
    "crates/mirai-server",
    "crates/mirai",
]

[workspace.package]
edition = "2024"
# The oldest compiler the tree is known to build with. Raise it whenever a dependency
# update needs a newer one; there is no other reason to hold it back or to push it.
rust-version = "1.92"
version = "0.1.0"
license = "GPL-3.0-or-later"

[workspace.dependencies]
mirai-core = { path = "crates/mirai-core" }
# Off by default: stable Cargo refuses a member's `default-features = false` when the
# workspace entry leaves defaults on, so each member names the features it uses.
mirai-proto = { path = "crates/mirai-proto", default-features = false }
mirai-engine = { path = "crates/mirai-engine", default-features = false }
mirai-client = { path = "crates/mirai-client" }

gtk = { package = "gtk4", version = "0.11.4", features = ["blueprint", "gnome_50"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9"] }
glib = { version = "0.22.8", features = ["futures"] }
glib-build-tools = "0.22.8"

# Only what every consumer needs: an executor, channels, timers and `select!`. Features
# used by one crate are declared there instead, so a remote-only consumer (the HarmonyOS
# client) does not build the subprocess machinery.
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
# quinn's defaults minus `platform-verifier`: mirai verifies the server with its own
# TOFU pin (`mirai-proto/src/transport.rs`) and never asks the OS for trust roots.
quinn = { version = "0.11.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
    "log",
    "bloom",
] }
# `ring` only: enabling rustls' default aws-lc-rs alongside quinn's ring provider would
# leave two installed providers and make `ClientConfig::builder()` panic at runtime.
# No `tls12`: QUIC is TLS 1.3 only (RFC 9001), and both endpoints pin TLS13.
rustls = { version = "0.23.43", default-features = false, features = [
    "ring",
    "std",
    "logging",
] }
rcgen = { version = "0.14.9", default-features = false, features = ["crypto", "pem", "ring"] }
subtle = "2.6.1"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
postcard = { version = "1.1.3", features = ["use-std"] }
bitflags = { version = "2.13.1", features = ["serde"] }
# Only the streaming codec is used. `zdict_builder` drags in `cover.c`, which calls
# `qsort_r` — absent from the OpenHarmony libc — and `legacy` decodes pre-0.8 frames that
# MRP never produces. Dropping both keeps every platform on the same zstd build.
zstd = { version = "0.13.3", default-features = false, features = ["arrays"] }
base64 = "0.23.1"

dashmap = "6.2.1"
arrayvec = "0.7.8"
smallvec = { version = "1.15.2", features = ["union"] }

thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6.6", features = ["derive"] }
toml = "1.1.4"
directories = "6.0.0"
encoding_rs = "0.8.35"

[profile.release]
opt-level = 3
lto = "thin"
