[workspace]
resolver = "3"
members = [
    "crates/mirai-core",
    "crates/mirai-proto",
    "crates/mirai-engine",
    "crates/mirai-client",
    "crates/mirai-server",
    "crates/mirai",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/zhaob1n/mirai"
readme = "README.md"

[workspace.dependencies]
# The `version` makes the path dependencies packageable. Cargo does not tie it to the
# workspace version above: bump all four by hand with it, or packaging fails.
mirai-core = { path = "crates/mirai-core", version = "0.1.0" }
# Off by default: stable Cargo refuses a member's `default-features = false` when the
# workspace entry leaves defaults on, so each member names the features it uses.
mirai-proto = { path = "crates/mirai-proto", version = "0.1.0", default-features = false }
mirai-engine = { path = "crates/mirai-engine", version = "0.1.0", default-features = false }
mirai-client = { path = "crates/mirai-client", version = "0.1.0" }

gtk = { package = "gtk4", version = "0.11.5", features = ["blueprint", "gnome_50"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9"] }
glib = { version = "0.22.10", features = ["futures"] }
glib-build-tools = "0.22.8"
# Fox lookup's HTTP client. GIO alone reaches `https://` only through GVfs's daemon, which
# is libsoup underneath and is absent on desktops without GVfs.
soup = { package = "soup3", version = "0.9.0" }

# Only what every consumer needs: an executor, channels, timers and `select!`. Features
# used by one crate are declared there instead, so a remote-only consumer (the HarmonyOS
# client) does not build the subprocess machinery.
tokio = { version = "1.53.2", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
# quinn's defaults minus `platform-verifier`: mirai verifies the server with its own
# TOFU pin (`mirai-proto/src/transport.rs`) and never asks the OS for trust roots.
quinn = { version = "0.11.12", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
    "log",
    "bloom",
] }
# `ring` only: enabling rustls' default aws-lc-rs alongside quinn's ring provider would
# leave two installed providers and make `ClientConfig::builder()` panic at runtime.
# No `tls12`: QUIC is TLS 1.3 only (RFC 9001), and both endpoints pin TLS13.
rustls = { version = "0.23.45", default-features = false, features = [
    "ring",
    "std",
    "logging",
] }
# 0.14.10 moved to pem 4, which shares our base64 0.23 instead of pulling 0.22.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
subtle = "2.6.1"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
postcard = { version = "1.1.3", features = ["use-std"] }
# No `serde` feature: `Want` serializes as its raw bits through hand-written impls.
bitflags = "2.13.2"
# Only the streaming codec is used, so none of the defaults is wanted. `zdict_builder`
# drags in `cover.c`, which calls `qsort_r` — absent from the OpenHarmony libc — `legacy`
# decodes pre-0.8 frames that MRP never produces, and `arrays` only adds `[u8; N]` output
# buffers where mirai writes into a `Vec`. Dropping them keeps every platform on the same
# zstd build.
zstd = { version = "0.14.0", default-features = false }
base64 = "0.23.1"

arrayvec = "0.7.8"
smallvec = { version = "1.16.2", features = ["union"] }

thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.1.6"
directories = "6.0.0"
encoding_rs = "0.8.42"

[profile.release]
opt-level = 3
lto = "thin"
